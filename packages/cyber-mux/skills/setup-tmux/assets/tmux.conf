# tmux, keyed and styled to match herdr's defaults (herdr 0.9.5).
# Mapping: herdr workspace = tmux session, tab = window, pane = pane.
# The sidebar is a pane drawn by ~/.config/tmux/herdr.sh.
# Installed by the cyber-mux setup-tmux skill.

# Catppuccin Mocha (herdr's default theme), accent = sky
#   text cdd6f4  subtext0 a6adc8  overlay0 6c7086  surface1 45475a  surface0 313244
#   crust 11111b  sky 89dceb  mauve cba6f7  green a6e3a1  peach fab387  red f38ba8

# ── General ───────────────────────────────────────────────────────────────────
set -g prefix C-b
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s extended-keys on
set -s set-clipboard on           # OSC 52 copy to the system clipboard
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1               # prefix+1..9 jumps to tab 1..9
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on                   # herdr is mouse-native
set -g detach-on-destroy off      # closing a workspace moves to another one
set -g set-titles on
set -g set-titles-string "#h: #S" # herdr's window_title "{hostname}: {workspace}"

# ── Agent attention (herdr: sound for background workspaces) ──────────────────
setw -g monitor-bell on
setw -g monitor-activity off
set -g bell-action other
set -g visual-bell off
set -g activity-action none

# ── Sidebar ───────────────────────────────────────────────────────────────────
set -g @herdr_sidebar_enabled 1
set-hook -g after-new-window      'run-shell -b "~/.config/tmux/herdr.sh ensure #{window_id}"'
set-hook -g after-new-session     'run-shell -b "~/.config/tmux/herdr.sh ensure #{window_id}"'
set-hook -g pane-exited           'run-shell -b "~/.config/tmux/herdr.sh gc"'
set-hook -g after-kill-pane       'run-shell -b "~/.config/tmux/herdr.sh gc"'
set-hook -g window-layout-changed 'run-shell -b "~/.config/tmux/herdr.sh borders #{window_id}"'
set-hook -g window-resized        'run-shell -b "~/.config/tmux/herdr.sh fixwidth"'
set-hook -g client-attached       'run-shell -b "~/.config/tmux/herdr.sh fixwidth"'
bind b run-shell -b "~/.config/tmux/herdr.sh toggle"                          # toggle sidebar

# ── Help / settings ───────────────────────────────────────────────────────────
bind ? list-keys -N -a -T prefix
bind s display-popup -E -w 80% -h 80% -T " Settings " '${EDITOR:-vi} ~/.tmux.conf && tmux source-file ~/.tmux.conf'
bind R source-file ~/.tmux.conf \; display "Config reloaded"

# ── Workspaces (sessions) ─────────────────────────────────────────────────────
bind N command-prompt -p "New workspace:" "new-session -s '%%' -c '#{pane_current_path}'"
bind W command-prompt -I "#S" -p "Rename workspace:" "rename-session '%%'"
bind D confirm-before -p "Close workspace #S? (y/n)" kill-session
bind w choose-tree -Zs                                                        # workspace navigation
bind g choose-tree -Z                                                         # goto picker
bind q detach-client
bind o next-window -a                                                         # jump to the tab that rang

# ── Tabs (windows) ────────────────────────────────────────────────────────────
# herdr asks for a tab name; leave it empty to keep the automatic name
bind c command-prompt -p "Tab name:" "new-window -c '#{pane_current_path}' ; if -F '#{!=:%1,}' \"rename-window -- '%1'\""
bind T command-prompt -I "#W" -p "Rename tab:" "rename-window '%%'"
bind X kill-window
# n / p / 1..9 are tmux defaults

# ── Panes ─────────────────────────────────────────────────────────────────────
unbind '"'
unbind %
unbind Space                      # layout cycling would squash the sidebar
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5
# Splitting or moving never lands on the sidebar pane.
bind v if -F "#{@herdr_sidebar}" "last-pane" \; split-window -h -c "#{pane_current_path}"
bind - if -F "#{@herdr_sidebar}" "last-pane" \; split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind P command-prompt -I "#{@herdr_label}" -p "Rename pane:" "set -p @herdr_label '%%'"
# z (zoom) and [ (copy mode) are tmux defaults

bind h    select-pane -L \; if -F "#{@herdr_sidebar}" "last-pane"
bind j    select-pane -D \; if -F "#{@herdr_sidebar}" "last-pane"
bind k    select-pane -U \; if -F "#{@herdr_sidebar}" "last-pane"
bind l    select-pane -R \; if -F "#{@herdr_sidebar}" "last-pane"
bind Tab  select-pane -t :.+ \; if -F "#{@herdr_sidebar}" "select-pane -t :.+"
bind BTab select-pane -t :.- \; if -F "#{@herdr_sidebar}" "select-pane -t :.-"

bind H if -F "#{==:#{pane_left},27}" "" "swap-pane -d -t '{left-of}'"
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L if -F "#{pane_at_right}" "" "swap-pane -d -t '{right-of}'"

bind e capture-pane -J -S - \; save-buffer /tmp/tmux-scrollback.txt \; delete-buffer \; \
  display-popup -E -w 90% -h 90% -T " Scrollback " '${EDITOR:-vi} /tmp/tmux-scrollback.txt'

# Resize mode: prefix+r, then h/j/k/l or arrows repeatedly; any other key leaves
bind r switch-client -T resize
bind -T resize h      resize-pane -L 2 \; switch-client -T resize
bind -T resize j      resize-pane -D 1 \; switch-client -T resize
bind -T resize k      resize-pane -U 1 \; switch-client -T resize
bind -T resize l      resize-pane -R 2 \; switch-client -T resize
bind -T resize Left   resize-pane -L 2 \; switch-client -T resize
bind -T resize Down   resize-pane -D 1 \; switch-client -T resize
bind -T resize Up     resize-pane -U 1 \; switch-client -T resize
bind -T resize Right  resize-pane -R 2 \; switch-client -T resize

# Prefix-free chords from herdr's "Going prefix-free" guide
bind -n C-M-h select-pane -L \; if -F "#{@herdr_sidebar}" "last-pane"
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R \; if -F "#{@herdr_sidebar}" "last-pane"
bind -n C-M-[ previous-window
bind -n C-M-] next-window
bind -n C-M-c new-window -c "#{pane_current_path}"
bind -n C-M-d split-window -h -c "#{pane_current_path}"
bind -n C-M-D split-window -v -c "#{pane_current_path}"
bind -n C-M-z resize-pane -Z

# ── Copy mode (herdr: v/Space select, y/Enter copy, q/Esc leave) ──────────────
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-selection-and-cancel \; display "Copied to clipboard"
bind -T copy-mode-vi Enter  send -X copy-selection-and-cancel \; display "Copied to clipboard"
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi Escape if -F "#{selection_present}" "send -X clear-selection" "send -X cancel"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel \; display "Copied to clipboard"

# ── Look ──────────────────────────────────────────────────────────────────────
# Panes: labels only on split windows (herdr's pane_borders = auto)
setw -g pane-border-status off
setw -g pane-border-lines single
setw -g pane-border-indicators off
setw -g pane-border-style        "fg=#45475a"
setw -g pane-active-border-style "fg=#89dceb"
setw -g pane-border-format "#{?#{@herdr_sidebar},,#{?#{@herdr_label},#[fg=#cdd6f4] #{@herdr_label} ,}}"

# Popups, menus, prompts, selection
set -g popup-border-lines rounded
set -g popup-border-style "fg=#89dceb"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#89dceb"
set -g menu-style "bg=default,fg=#cdd6f4"
set -g menu-selected-style "bg=#313244,fg=#cdd6f4,bold"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#89dceb"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g copy-mode-match-style "bg=#45475a,fg=#f9e2af"
setw -g copy-mode-current-match-style "bg=#fab387,fg=#11111b"
set -g display-panes-colour "#45475a"
set -g display-panes-active-colour "#89dceb"
setw -g clock-mode-colour "#89dceb"

# Tab row on top. The right side becomes a mode bar in prefix, copy and resize mode.
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#a6adc8"
set -g status-left-length 40
set -g status-left "#{?#{==:#{@herdr_sidebar_enabled},0},#[fg=#89dceb]#[bold] #S #[default]#[fg=#45475a]│,}"
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#a6adc8] #I #W#{?window_bell_flag,#[fg=#a6e3a1] ✓,}#{?window_zoomed_flag,#[fg=#fab387] Z,} "
setw -g window-status-current-format "#[bg=#313244]#[fg=#cdd6f4]#[bold] #I #W#{?window_zoomed_flag,#[fg=#fab387] Z,} #[default]"
set -g status-right-length 120
set -g status-right "\
#{?client_prefix,#[bg=#89dceb]#[fg=#11111b]#[bold] PREFIX #[default]#[fg=#6c7086]  c tab  v/- split  hjkl move  w spaces  g goto  b sidebar  ? help ,}\
#{?#{==:#{client_key_table},resize},#[bg=#fab387]#[fg=#11111b]#[bold] RESIZE #[default]#[fg=#6c7086]  hjkl resize  esc done ,}\
#{?pane_in_mode,#[bg=#cba6f7]#[fg=#11111b]#[bold] COPY #[default]#[fg=#6c7086]  v select  y copy  / search  q quit ,}"

# Sidebars for windows that already exist (e.g. after prefix+R)
run-shell -b "~/.config/tmux/herdr.sh ensure-all"
