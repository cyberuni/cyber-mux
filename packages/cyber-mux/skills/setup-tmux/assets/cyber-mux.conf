# cyber-mux keys for tmux. Installed by the cyber-mux setup-tmux skill to ~/.config/tmux/cyber-mux.conf.
# Each key runs in the tmux server through ~/.config/tmux/cyber-mux.sh, so it works while the
# program in the pane is busy, and it takes no turn from an agent.

# prefix+B: back to the pane this one was jumped into from (cyber-mux focus --back)
bind B run-shell -b '~/.config/tmux/cyber-mux.sh "#{pane_id}" focus --back'
