name: pull-request
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v1
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # The real-boundary suite (`pnpm test:integration`), which `pnpm verify` deliberately excludes:
  # it drives the ACTUAL tmux and herdr binaries rather than a mocked Exec. Opt-in locally, run
  # here so the frozen scenarios that only a live backend can exercise stop resting on source
  # re-derivation. Runs outside any multiplexer pane, which is what unlocks the placements the
  # suite gates away from a caller's own session.
  #
  # Non-blocking for now: herdr with no attached client is unproven in CI. Once this is green
  # across a run of PRs, drop `continue-on-error` and make it required.
  live-backends:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Pinned, not "latest": a herdr release should never silently change what this suite runs
      # against. Bump deliberately, the same way mise pins the toolchain.
      HERDR_VERSION: v0.8.0
      WEZTERM_VERSION: 20240203-110809-5046fc22
      # 0.44.x or newer is a HARD floor, not a preference: the whole per-pane-addressable surface the
      # adapter stands on (`--pane-id` across the verbs, `list-panes --json`, ids returned from
      # `new-pane`/`new-tab`, `focus-pane-id`) landed in 0.44.0. Older binaries fail every command.
      ZELLIJ_VERSION: v0.44.3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # Upstream publishes statically linked release binaries, so this needs no package manager and
      # no toolchain. (herdr is also in homebrew-core, but Homebrew is NOT on the ubuntu-24.04
      # runner image — `brew` is simply not on PATH there.)
      - name: Install herdr
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/${HERDR_VERSION}/herdr-linux-x86_64"
          sudo install -m 0755 "${RUNNER_TEMP}/herdr" /usr/local/bin/herdr
          herdr --version

      # Every herdr verb talks to one background server over a unix socket. Start it explicitly and
      # wait for it to answer, rather than letting the first test command race the daemon's startup.
      - name: Start the herdr server
        run: |
          nohup herdr server >/tmp/herdr-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if herdr status | grep -q 'status: running'; then
              echo "herdr server is up"
              exit 0
            fi
            sleep 1
          done
          echo "herdr server did not come up in 30s"
          cat /tmp/herdr-server.log
          exit 1

      # wezterm's own CLI is a CLIENT: by default it talks to a running GUI, which a runner does not
      # have. `wezterm-mux-server` is the headless server it can talk to instead (`wezterm cli
      # --prefer-mux`), and it ships in the same release tarball. Pinned for the same reason herdr is.
      #
      # Ubuntu22.04, NOT Ubuntu20.04: the 20.04 build links libssl.so.1.1, which this runner image
      # (24.04) no longer carries, and it fails at load with a message that looks nothing like a
      # missing dependency.
      - name: Install wezterm (CLI + headless mux server)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wezterm.tar.xz" \
            "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/wezterm-${WEZTERM_VERSION}.Ubuntu22.04.tar.xz"
          tar -xJf "${RUNNER_TEMP}/wezterm.tar.xz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/wezterm/usr/bin/wezterm" /usr/local/bin/
          sudo install -m 0755 "${RUNNER_TEMP}/wezterm/usr/bin/wezterm-mux-server" /usr/local/bin/
          wezterm --version
          wezterm-mux-server --version

      # The musl build is statically linked, so — like herdr — it needs no package manager and no
      # toolchain. Zellij needs no server started here: the suite creates its own background session
      # under a private XDG_RUNTIME_DIR, which is also what isolates it from anything else on the box.
      #
      # `script` (util-linux) is a real dependency of that suite, not an incidental one: it allocates
      # the PTY for the one client `new-pane --direction` requires. It is on the runner image already;
      # the suite skips rather than fails if it ever is not.
      - name: Install zellij
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/zellij.tar.gz" \
            "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "${RUNNER_TEMP}/zellij.tar.gz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/zellij" /usr/local/bin/zellij
          zellij --version
          script --version | head -1

      - run: pnpm install --frozen-lockfile

      # The CLI-level tests drive `bin/cyber-mux.mjs`, which loads `dist/cli.mjs` — they need a build.
      - run: pnpm build

      - name: Run the real-boundary suite
        run: pnpm cm test:integration

      # Diagnostics only — must never be the thing that reports the job as broken. An earlier step
      # can fail before the server was ever started, in which case there is simply no log to show.
      - name: herdr server log
        if: failure()
        run: cat /tmp/herdr-server.log || echo "(no herdr server log — it never started)"
