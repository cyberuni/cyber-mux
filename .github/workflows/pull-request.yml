name: pull-request
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v1
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # The real-boundary suite (`pnpm test:integration`), which `pnpm verify` deliberately excludes:
  # it drives the ACTUAL tmux and herdr binaries rather than a mocked Exec. Opt-in locally, run
  # here so the frozen scenarios that only a live backend can exercise stop resting on source
  # re-derivation. Runs outside any multiplexer pane, which is what unlocks the placements the
  # suite gates away from a caller's own session.
  #
  # BLOCKING. It was `continue-on-error: true` while herdr-with-no-attached-client was unproven here,
  # and that flag outlived its reason: because the job could not fail the run, a red real-boundary
  # suite reported as a green run, and a false green landed on PR #114. The last thing keeping the
  # flag on was the zellij suite's own flakiness, fixed in #115 — a lost or misdelivered `zellij
  # action` reply read as an empty session — so a failure here is now a real one and says so.
  live-backends:
    runs-on: ubuntu-latest
    env:
      # Pinned, not "latest": a herdr release should never silently change what this suite runs
      # against. Bump deliberately, the same way mise pins the toolchain.
      HERDR_VERSION: v0.8.0
      WEZTERM_VERSION: 20240203-110809-5046fc22
      # 0.45.0 or newer is a HARD floor, not a preference, and it is the floor `mux.zellij.ts`
      # declares. Two releases set it. 0.44.0 brought the per-pane-addressable surface the adapter
      # stands on (`--pane-id` across the verbs, `list-panes --json`, ids returned from
      # `new-pane`/`new-tab`, `focus-pane-id`); below it every command fails. 0.45.0 brought
      # `--no-focus`, which `open` passes on `new-tab` and on a `new-pane` that names no `from` — on
      # 0.44.x that is an unknown argument, so zellij exits nonzero having created nothing and every
      # open dies. This pin and the adapter's declared floor have to move together: pinning lower
      # does not test an older floor, it just fails the whole suite.
      ZELLIJ_VERSION: v0.45.0
      # 3.7 or newer is a HARD floor for the floating-pane rows: `new-pane` is tmux 3.7's own command
      # and simply does not exist below it. Ubuntu's packaged tmux is 3.4, so `apt-get install tmux`
      # left every float row SKIPPING here — present in the report, covering nothing. Pinned to an
      # exact release for the same reason herdr and zellij are.
      TMUX_VERSION: 3.7c
      # Pinned for the same reason as every binary above: an rmux release should never silently
      # change what this suite runs against. There is no version FLOOR here — unlike zellij and tmux,
      # nothing the rmux adapter drives landed in a specific release; 0.10.0 is simply the version the
      # adapter was probed against and the one its comments name.
      RMUX_VERSION: v0.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Built from source, not installed from apt: Ubuntu 24.04 ships tmux 3.4, which has no
      # `new-pane` and so cannot exercise the floating-pane placement at all. Upstream publishes only
      # a source tarball — there is no official binary and no maintained 3.7 PPA — so the build is the
      # cheapest route to a version this suite can actually cover floats on. tmux is a small C
      # codebase and this costs well under a minute.
      #
      # `bison` is not optional despite tmux being plain C: `cmd-parse.y` is a yacc grammar, and
      # configure fails at the `yacc` check without it.
      - name: Install tmux ${{ env.TMUX_VERSION }} (from source — apt's is 3.4, too old for floats)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison libevent-dev libncurses-dev pkg-config
          curl -fsSL -o "${RUNNER_TEMP}/tmux.tar.gz" \
            "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/tmux.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/tmux-${TMUX_VERSION}"
          ./configure
          make -j"$(nproc)"
          sudo make install
          # Fail the step here rather than letting the suite silently skip its float rows on a build
          # that quietly produced the wrong version.
          tmux -V
          tmux -V | grep -q "${TMUX_VERSION}"

      # Upstream publishes statically linked release binaries, so this needs no package manager and
      # no toolchain. (herdr is also in homebrew-core, but Homebrew is NOT on the ubuntu-24.04
      # runner image — `brew` is simply not on PATH there.)
      - name: Install herdr
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/${HERDR_VERSION}/herdr-linux-x86_64"
          sudo install -m 0755 "${RUNNER_TEMP}/herdr" /usr/local/bin/herdr
          herdr --version

      # Every herdr verb talks to one background server over a unix socket. Start it explicitly and
      # wait for it to answer, rather than letting the first test command race the daemon's startup.
      - name: Start the herdr server
        run: |
          nohup herdr server >/tmp/herdr-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if herdr status | grep -q 'status: running'; then
              echo "herdr server is up"
              exit 0
            fi
            sleep 1
          done
          echo "herdr server did not come up in 30s"
          cat /tmp/herdr-server.log
          exit 1

      # wezterm's own CLI is a CLIENT: by default it talks to a running GUI, which a runner does not
      # have. `wezterm-mux-server` is the headless server it can talk to instead (`wezterm cli
      # --prefer-mux`), and it ships in the same release tarball. Pinned for the same reason herdr is.
      #
      # Ubuntu22.04, NOT Ubuntu20.04: the 20.04 build links libssl.so.1.1, which this runner image
      # (24.04) no longer carries, and it fails at load with a message that looks nothing like a
      # missing dependency.
      - name: Install wezterm (CLI + headless mux server)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wezterm.tar.xz" \
            "https://github.com/wezterm/wezterm/releases/download/${WEZTERM_VERSION}/wezterm-${WEZTERM_VERSION}.Ubuntu22.04.tar.xz"
          tar -xJf "${RUNNER_TEMP}/wezterm.tar.xz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/wezterm/usr/bin/wezterm" /usr/local/bin/
          sudo install -m 0755 "${RUNNER_TEMP}/wezterm/usr/bin/wezterm-mux-server" /usr/local/bin/
          wezterm --version
          wezterm-mux-server --version

      # The musl build is statically linked, so — like herdr — it needs no package manager and no
      # toolchain. Zellij needs no server started here: the suite creates its own background session
      # under a private XDG_RUNTIME_DIR, which is also what isolates it from anything else on the box.
      #
      # `script` (util-linux) is a real dependency of that suite, not an incidental one: it allocates
      # the PTY for the one client `new-pane --direction` requires. It is on the runner image already;
      # the suite skips rather than fails if it ever is not.
      - name: Install zellij
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/zellij.tar.gz" \
            "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "${RUNNER_TEMP}/zellij.tar.gz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/zellij" /usr/local/bin/zellij
          zellij --version
          script --version | head -1

      # rmux ships prebuilt release tarballs, so this needs no Rust toolchain — `cargo install rmux`
      # would work but costs a full release build on every run.
      #
      # `install.sh --prefix`, NOT a bare `install -m 0755 bin/rmux /usr/local/bin`: the `rmux` binary
      # is a launcher that resolves a PRIVATE helper at `<prefix>/libexec/rmux/rmux`, and a copied-out
      # binary dies with `private rmux helper not found under libexec/rmux` on the first command.
      # Verified by doing exactly that and watching it fail, then watching the installer's layout
      # work. The installer also runs its own post-install layout smoke, so a broken extract fails
      # here rather than as a suite-wide skip.
      #
      # rmux needs no server started: like tmux, each `-L <socket>` command spawns its own
      # `rmux-daemon` on demand, and the suite creates and kills a throwaway one per run.
      - name: Install rmux ${{ env.RMUX_VERSION }}
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/rmux.tar.gz" \
            "https://github.com/Helvesec/rmux/releases/download/${RMUX_VERSION}/rmux-${RMUX_VERSION#v}-linux-x86_64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/rmux.tar.gz" -C "${RUNNER_TEMP}"
          sudo "${RUNNER_TEMP}/rmux-${RMUX_VERSION#v}-linux-x86_64/install.sh" --prefix /usr/local
          # Fail the step here rather than letting the whole rmux suite silently SKIP on a runner
          # where the install quietly produced nothing — the exact failure shape issue #125 names.
          rmux -V
          rmux -V | grep -q "${RMUX_VERSION#v}"

      - run: pnpm install --frozen-lockfile

      # The CLI-level tests drive `bin/cyber-mux.mjs`, which loads `dist/cli.mjs` — they need a build.
      - run: pnpm build

      - name: Run the real-boundary suite
        run: pnpm cm test:integration

      # Diagnostics only — must never be the thing that reports the job as broken. An earlier step
      # can fail before the server was ever started, in which case there is simply no log to show.
      - name: herdr server log
        if: failure()
        run: cat /tmp/herdr-server.log || echo "(no herdr server log — it never started)"
